<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分析フォーム</title>
    <!-- 表示速度の改善(2026-11-06): 外部CDNの読み込みを待たずに、画面とフォームのデータ取得を先に始める -->
    <link rel="preconnect" href="https://xztaacxjlluzqzehendp.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <!-- 読み込み中のくるくる: アイコンフォント(外部CDN)に頼らず、この中のCSSだけで描く(すぐ表示される) -->
    <style>
        html, body { background: #fdfbfb; }
        .fl-spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(0,0,0,0.12); border-top-color: #0d6efd; animation: fl-spin 0.8s linear infinite; }
        @keyframes fl-spin { to { transform: rotate(360deg); } }
    </style>
    <!-- フォームの中身(Supabase)の取得を、画面の読み込みと並行して「今すぐ」開始する。
         form.js はこの結果(window.__meoFormPromise)を使う。失敗した場合は form.js が従来どおりの方法で取り直す。
         ※URL・キーは form.js の supabaseUrl / supabaseKey と同じもの(公開用のanonキー) -->
    <script>
        (function () {
            try {
                var u = 'https://xztaacxjlluzqzehendp.supabase.co';
                var k = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6dGFhY3hqbGx1enF6ZWhlbmRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMzM4NzMsImV4cCI6MjA4OTgwOTg3M30.79wvIPepXjvPZwLHOPX7KullShvdvCB7LS2gZO5CtuQ';
                window.__meoT0 = (window.performance && performance.now) ? performance.now() : 0;
                window.__meoFormPromise = fetch(u + '/rest/v1/customers?select=data&service_type=eq.meo_form&limit=1', {
                    headers: { apikey: k, Authorization: 'Bearer ' + k }
                }).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                });
                window.__meoFormPromise.catch(function () { /* 失敗時は form.js 側で取り直す */ });
            } catch (e) { window.__meoFormPromise = null; }
        })();
    </script>
    <!-- Fonts: 文字の表示を止めないよう、読み込み完了後に反映する -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <!-- Icons / Supabase: async にして、これらの読み込み待ちでフォームの表示が止まらないようにする -->
    <script async src="https://unpkg.com/@phosphor-icons/web"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div id="loading" class="loading-screen">
        <div class="fl-spinner"></div>
    </div>
    
    <div id="form-container" class="form-container" style="display: none;">
        <button id="form-close-btn" class="form-close-btn" aria-label="閉じる">✕</button>

        <div id="slide-container" class="slide-container">
            <!-- Slides will be injected here by JS -->
        </div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="navigation-controls" id="nav-controls" style="display:none;">
            <button class="nav-btn" id="btn-prev" style="opacity: 0.5;"><i class="ph ph-caret-up"></i></button>
            <button class="nav-btn" id="btn-next"><i class="ph ph-caret-down"></i></button>
        </div>

        <!-- 回答途中で×ボタンを押した際の離脱確認POP(2026-08-22 コージさん指示により追加) -->
        <div class="confirm-overlay" id="confirm-overlay">
            <div class="confirm-card">
                <div class="confirm-icon">!</div>
                <div class="confirm-title">回答を中断しますか？</div>
                <div class="confirm-body">ここまで入力した回答内容は保存されず<br><b>すべて削除されます。</b><br>本当に終了しますか？</div>
                <div class="confirm-actions">
                    <button class="confirm-btn confirm-btn-primary" id="confirm-continue-btn">続ける</button>
                    <button class="confirm-btn confirm-btn-ghost" id="confirm-exit-btn">終了する</button>
                </div>
            </div>
        </div>
    </div>

    <script src="form.js"></script>
</body>
</html>
